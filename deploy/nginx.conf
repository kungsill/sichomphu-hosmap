# nginx reverse proxy สำหรับ Smart Hospital Navigation
# วางใน conf.d/ แล้วแก้ path ใบรับรอง
server {
    listen 80;
    server_name nav.scphos.go.th;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name nav.scphos.go.th;

    ssl_certificate     /etc/ssl/scphos/fullchain.pem;
    ssl_certificate_key /etc/ssl/scphos/privkey.pem;

    client_max_body_size 20m;   # อัปโหลดแปลนอาคาร

    # หน้าเจ้าหน้าที่: เปิดเฉพาะเครือข่ายโรงพยาบาล (ลบถ้าต้องการเปิดจากภายนอก)
    location ~ ^/(builder|poster|slip/|api/live|api/stream|api/visits/|api/admin/) {
        allow 192.168.0.0/16; allow 10.0.0.0/8; allow 172.16.0.0/12; deny all;
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/hosmap_proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/hosmap_proxy.conf;
    }
}


# -------------------------------------------------------------------------------------
# โหมดสาธิต: ฐานข้อมูลจำลอง (SQLite) ที่ใช้ชื่อตาราง/คอลัมน์เลียนแบบ HOSxP บางส่วน
# -------------------------------------------------------------------------------------
[mock]
visits =
    SELECT o.vn, o.hn, o.vstdate, o.vsttime, o.oqueue, o.main_dep,
           o.cur_dep, o.cur_dep_busy AS busy, o.cur_dep_time,
           CASE WHEN o.ovstost IS NOT NULL AND o.ovstost <> '' THEN 1 ELSE 0 END AS finished,
           CAST((julianday(o.vstdate) - julianday(p.birthday)) / 365.25 AS INTEGER) AS age, p.sex,
           o.doctor_room AS room_hint,
           s.bw, s.bps, s.bpd, s.temperature
    FROM ovst o
    LEFT JOIN patient p ON p.hn = o.hn
    LEFT JOIN opdscreen s ON s.vn = o.vn
    WHERE o.vstdate = :today

orders =
    SELECT vn, depcode, status FROM mock_orders WHERE vstdate = :today

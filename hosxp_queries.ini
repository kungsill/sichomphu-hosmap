# =====================================================================================
#  คำสั่ง SQL ที่ตัวเชื่อม (Integration Worker) ใช้อ่านข้อมูลจาก HOSxP V4 แบบอ่านอย่างเดียว
# =====================================================================================
#  !!! ต้องตรวจสอบกับฐานข้อมูล HOSxP ของโรงพยาบาลสีชมพูก่อนใช้งานจริง !!!
#  วิธีตรวจ: ให้เจ้าหน้าที่กด ส่งตรวจ / รับผู้ป่วย / ส่งกลับ / จบงาน ในฐานข้อมูลทดสอบ
#  แล้วดูว่าคอลัมน์ใดเปลี่ยนบ้าง (เช่น ovst.cur_dep, ovst.cur_dep_busy, ovst.cur_dep_time, ovst.ovstost)
#
#  คอลัมน์ที่คำสั่ง [*.visits] ต้องคืนค่า (ชื่อตามนี้):
#    vn, hn, vstdate, vsttime, oqueue, main_dep, cur_dep, busy, cur_dep_time, finished,
#    age, sex, room_hint, bw, bps, bpd, temperature  (+ queue_no ไม่บังคับ = เลขคิวที่พิมพ์บนใบคิว)
#      busy       = หน่วยบริการรับผู้ป่วยแล้ว/กำลังให้บริการ ('Y' หรือ 1)
#      finished   = จบ Visit แล้ว (1/0)
#      served     = (ไม่บังคับ) ให้บริการที่หน่วยปัจจุบันเสร็จแล้ว รอส่งต่อ (1/0)
#      room_hint  = รหัสห้องย่อย ถ้า HOSxP บันทึกไว้ (เช่น ห้องตรวจ 1–5) ไม่มีให้คืน NULL
#                   ระบบจะไม่เดาห้องจากรหัสแผนก แต่จะพาไปพื้นที่รอของแผนกแทน
#
#  คอลัมน์ที่คำสั่ง [*.orders] ต้องคืนค่า (ใช้แสดงงานค้างหลายห้อง เช่น รอ LAB และ X-ray พร้อมกัน):
#    vn, depcode, status      (status: ordered / received / done)
#    เว้นว่างได้ ถ้ายังไม่ต้องการใช้
#
#  พารามิเตอร์ที่ใช้ได้: :today (วันที่ปัจจุบัน)
# =====================================================================================

[mysql]
visits =
    SELECT o.vn, o.hn, o.vstdate, o.vsttime, o.oqueue, o.main_dep,
           o.cur_dep, o.cur_dep_time,
           -- รพ.สีชมพู: ใช้คิวหน่วยบริการ opd_dep_queue (แถวล่าสุดของหน่วยปัจจุบัน)
           --   accept_datetime = เจ้าหน้าที่รับผู้ป่วยแล้ว, finish_datetime = ให้บริการที่หน่วยนี้เสร็จ
           CASE WHEN q.accept_datetime IS NOT NULL AND q.finish_datetime IS NULL THEN 1 ELSE 0 END AS busy,
           CASE WHEN q.finish_datetime IS NOT NULL THEN 1 ELSE 0 END AS served,
           -- จบ Visit: ส่งไป 176 (ตรวจเสร็จกลับบ้าน) / 999 (รับยากลับบ้าน) หรือห้องยาจ่ายยาเสร็จแล้ว
           -- (ovstost ใช้ไม่ได้ เพราะมีค่า 0/00/1 ตั้งแต่ระหว่างรับบริการ)
           CASE WHEN o.cur_dep IN ('176', '999')
                  OR (o.cur_dep IN ('010', '039') AND q.finish_datetime IS NOT NULL) THEN 1 ELSE 0 END AS finished,
           TIMESTAMPDIFF(YEAR, p.birthday, o.vstdate) AS age, p.sex,
           NULL AS room_hint,
           -- เลขคิวที่ neoQ พิมพ์บนใบคิว (เช่น G113, C26) จากตาราง neoq_track_ovst
           (SELECT MAX(t.queue_type) FROM neoq_track_ovst t WHERE t.vn = o.vn) AS queue_no,
           s.bw, s.bps, s.bpd, s.temperature
    FROM ovst o
    LEFT JOIN patient p ON p.hn = o.hn
    LEFT JOIN opdscreen s ON s.vn = o.vn
    LEFT JOIN opd_dep_queue q ON q.opd_dep_queue_id = (
           SELECT MAX(q2.opd_dep_queue_id) FROM opd_dep_queue q2 WHERE q2.vn = o.vn AND q2.depcode = o.cur_dep)
    WHERE o.vstdate = :today

